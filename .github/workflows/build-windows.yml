
name: Build Newflasher Windows v60

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact v60 source
        uses: actions/checkout@v4
        with:
          ref: d3936b9c105669b228b1d03e0cc9fc70ea94f071
          persist-credentials: false

      - name: Install Windows cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make wget curl tar xxd file mingw-w64 \
            autoconf automake libtool

      - name: Verify exact source version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd3936b9c105669b228b1d03e0cc9fc70ea94f071'
          grep -Eq '^[[:space:]]*#define[[:space:]]+VERSION[[:space:]]+60([[:space:]]|$)' version.h
          cat version.h
          command -v i686-w64-mingw32-gcc
          command -v i686-w64-mingw32-windres

      - name: Download and verify zlib 1.3.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://zlib.net/fossils/zlib-1.3.1.tar.gz' \
            -o zlib-1.3.1.tar.gz
          echo '9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  zlib-1.3.1.tar.gz' | sha256sum -c -
          tar -xzf zlib-1.3.1.tar.gz
          test -f zlib-1.3.1/configure

      - name: Download and verify Expat 2.2.9
        run: |
          set -euo pipefail
          if ! curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/libexpat/libexpat/releases/download/R_2_2_9/expat-2.2.9.tar.gz' \
            -o expat-2.2.9.tar.gz; then
            echo 'GitHub Expat download failed; trying project SourceForge archive'
            curl --fail --location --retry 3 --silent --show-error \
              'https://sourceforge.net/projects/expat/files/expat/2.2.9/expat-2.2.9-RENAMED-VULNERABLE-PLEASE-USE-2.4.1-INSTEAD.tar.gz/download' \
              -o expat-2.2.9.tar.gz
          fi
          echo '69dc2af49910b18708084bfd78ed422d973bc2d8f76c46320581436a8bb7f47e32322c4526d92ca763aec4b5596ba8c8fc663c486258e47fbaeaeeed6efebd91  expat-2.2.9.tar.gz' | sha512sum -c -
          tar -xzf expat-2.2.9.tar.gz
          test -f expat-2.2.9/configure

      - name: Bundle driver from Newflasher maintainer repository
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/munjeni/newflasher/master/Sony_Mobile_Software_Update_Drivers_x64_Setup.msi' \
            -o GordonGate
          echo 'Driver source: munjeni/newflasher on GitHub (not Sony original host)'
          file GordonGate
          test "$(stat -c%s GordonGate)" -gt 1048576
          test "$(od -An -tx1 -N8 GordonGate | tr -d ' \n')" = 'd0cf11e0a1b11ae1'
          sha256sum GordonGate
          mkdir -p include
          xxd --include GordonGate > include/GordonGate.h
          grep -q 'GordonGate_len' include/GordonGate.h

      - name: Build Windows EXE
        run: |
          set -euo pipefail
          make newflasher.exe
          test -s newflasher.exe
          file newflasher.exe
          file newflasher.exe | grep -q 'PE32 executable'

      - name: Generate checksum
        run: |
          sha256sum newflasher.exe | tee newflasher.exe.sha256

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-v60-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            newflasher.exe
            newflasher.exe.sha256
