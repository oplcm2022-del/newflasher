
name: Build Newflasher Windows v60

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Newflasher v60
        uses: actions/checkout@v4
        with:
          ref: d3936b9c105669b228b1d03e0cc9fc70ea94f071

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y \
            make wget tar xxd \
            mingw-w64 \
            autoconf automake libtool

      - name: Verify version 60
        run: |
          git rev-parse HEAD
          cat version.h
          grep -Eq '^[[:space:]]*#define[[:space:]]+VERSION[[:space:]]+60([[:space:]]|$)' version.h

      - name: Build Windows EXE
        run: |
          make newflasher.exe

      - name: SHA256
        run: |
          sha256sum newflasher.exe | tee newflasher.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-v60-windows
          path: |
            newflasher.exe
            newflasher.exe.sha256
